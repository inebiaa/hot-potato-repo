<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover, rate, and review fashion and music shows from around the world."
    />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="canonical" href="https://www.secretblogger.app/" />

    <meta property="og:site_name" content="Secret Blogger" data-secret-blogger-site-social="" />
    <meta property="og:locale" content="en_US" data-secret-blogger-site-social="" />
    <meta property="og:type" content="website" data-secret-blogger-site-social="" />
    <meta property="og:title" content="Secret Blogger" data-secret-blogger-site-social="" />
    <meta
      property="og:description"
      content="Discover, rate, and review fashion and music shows from around the world."
      data-secret-blogger-site-social=""
    />
    <!-- og:description + meta description are overwritten at build from Branding home subtitle. -->
    <meta property="og:url" content="https://www.secretblogger.app/" data-secret-blogger-site-social="" />
    <!-- og:image is overwritten at build from Branding (logo → icon → favicon). -->
    <meta property="og:image" content="" data-secret-blogger-site-social="" />
    <meta property="og:image:secure_url" content="" data-secret-blogger-site-social="" />
    <meta property="og:image:alt" content="Secret Blogger" data-secret-blogger-site-social="" />

    <title>Secret Blogger</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
